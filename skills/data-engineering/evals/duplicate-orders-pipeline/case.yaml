schema_version: "1.1"
name: duplicate-orders-pipeline
expected_outcome: |
  Does not just rerun or loop the job. Makes the load safe to repeat with staging and a merge or partition overwrite, extracts updates and refunds with a watermark or change capture instead of offset paging, adds data checks and reconciles revenue against finance, backfills into a staging copy in chunks before touching production, and refuses to load emails and addresses without a need.
